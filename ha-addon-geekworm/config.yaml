name: "Geekworm UPS HAT Daemon"
description: "Reads battery voltage, capacity and AC status from a Geekworm UPS HAT (X728, X1200) and exposes them via a local REST API for the Geekworm UPS HAT integration."
version: "1.1.0"
slug: "geekworm-daemon"
init: false
arch:
  - aarch64

# Hardware access
privileged:
  - SYS_RAWIO
devices:
  - /dev/i2c-1
  - /dev/gpiochip0
  - /dev/gpiochip1
  - /dev/gpiochip2
  - /dev/gpiochip3
  - /dev/gpiochip4

# The integration connects here
ports:
  8099/tcp: 8099
ports_description:
  8099/tcp: "UPS HAT REST API"

# User-configurable options
# board: x728 | x1200
# hw_version and buzzer_on_ac_loss apply to the X728 only (ignored on the X1200)
options:
  board: "x728"
  hw_version: "v2.1"
  daemon_port: 8099
  poll_interval: 10
  shutdown_voltage: 3.0
  shutdown_capacity: 5
  shutdown_delay: 10
  buzzer_on_ac_loss: true
  gpio_chip: "autodetect"

schema:
  board: list(x728|x1200)
  hw_version: list(v1.x/v2.0|v2.1|v2.2|v2.3|v2.4|v2.5)
  daemon_port: int(1024,65535)
  poll_interval: int(5,120)
  shutdown_voltage: float(0.0,4.5)
  shutdown_capacity: int(0,50)
  shutdown_delay: int(5,120)
  buzzer_on_ac_loss: bool
  gpio_chip: "list(autodetect|/dev/gpiochip0|/dev/gpiochip1|/dev/gpiochip2|/dev/gpiochip3|/dev/gpiochip4)"

image: "ghcr.io/fir006c/ha-addon-geekworm"
