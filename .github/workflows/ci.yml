name: CI – Lint & Validate

on:
  push:
    branches: ["main", "master", "dev", "develop"]
  pull_request:
    branches: ["main", "master"]

jobs:
  lint-python:
    name: Python lint (daemon)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install linters
        run: pip install flake8

      - name: flake8 - addon daemon
        run: flake8 ha-addon-geekworm/geekworm_daemon.py --max-line-length=100

      - name: flake8 – integration
        run: flake8 custom_components/geekworm_ups/ --max-line-length=100

  validate-integration:
    name: Validate HA integration structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install hassfest dependencies
        run: pip install homeassistant voluptuous

      - name: Check manifest.json fields
        run: |
          python3 - <<'EOF'
          import json, sys
          with open("custom_components/geekworm_ups/manifest.json") as f:
              m = json.load(f)
          required = ["domain", "name", "version", "config_flow", "iot_class"]
          missing = [k for k in required if k not in m]
          if missing:
              print(f"ERROR: manifest.json missing keys: {missing}")
              sys.exit(1)
          print("manifest.json OK:", m["domain"], m["version"])
          EOF

      - name: Check translations match en.json
        run: |
          python3 - <<'EOF'
          import json, pathlib, sys

          def keys(d, prefix=""):
              out = set()
              for k, v in d.items():
                  path = f"{prefix}.{k}" if prefix else k
                  out |= keys(v, path) if isinstance(v, dict) else {path}
              return out

          folder = pathlib.Path("custom_components/geekworm_ups/translations")
          ref = keys(json.loads((folder / "en.json").read_text(encoding="utf-8")))
          failed = False
          for f in sorted(folder.glob("*.json")):
              k = keys(json.loads(f.read_text(encoding="utf-8")))
              missing, extra = ref - k, k - ref
              if missing or extra:
                  failed = True
                  print(f"ERROR {f.name}: missing={sorted(missing)} extra={sorted(extra)}")
              else:
                  print(f"{f.name} OK")
          sys.exit(1 if failed else 0)
          EOF

  validate-addon:
    name: Validate add-on config.yaml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Parse config.yaml
        run: |
          python3 - <<'EOF'
          import yaml, sys
          with open("ha-addon-geekworm/config.yaml") as f:
              cfg = yaml.safe_load(f)
          required = ["name", "version", "slug", "arch", "options", "schema"]
          missing = [k for k in required if k not in cfg]
          if missing:
              print(f"ERROR: config.yaml missing keys: {missing}")
              sys.exit(1)
          print("config.yaml OK:", cfg["name"], cfg["version"])
          EOF
